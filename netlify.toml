[build]
  command = "npm install && node build.js && rm -rf node_modules && cd 'YVALAW OS' && npm install && npm run build && mkdir -p ../os && cp -r dist/. ../os/"
  publish = "."
  functions = "YVALAW OS/netlify/functions"

[functions."run-autopay"]
  schedule = "0 13 * * *"

# YVA Time: screenshots are kept 60 days
[functions."purge-old-screenshots"]
  schedule = "@daily"

# YVA OS: email + phone push for new notifications (bell)
[functions."notifications-dispatch"]
  schedule = "*/5 * * * *"

# YVA OS weekly close: Monday 12:05 am Dominican time (04:05 UTC) — prepares last week's invoices
[functions."week-close-scheduled"]
  schedule = "5 4 * * 1"

# YVA OS payroll: Wednesday 9:07 am Dominican time — prepares Friday's payroll + reminder
[functions."payroll-reminder"]
  schedule = "7 13 * * 3"

# YVA OS CRM: lead follow-ups due today, 8:17 am Dominican time
[functions."crm-followups"]
  schedule = "17 12 * * *"

# YVA OS weekly reminder email: checks every hour (at :23) whether Settings → Notifications says it's time
[functions."weekly-reminder"]
  schedule = "23 * * * *"

# YVA OS expenses: adds the copies of repeating expenses (rent, software…) due today, 12:30 am Dominican time
[functions."expenses-recurring"]
  schedule = "30 4 * * *"

# Marketing-site blog: publishes scheduled posts (see the function for setup)
[functions."publish-scheduled-posts"]
  schedule = "@hourly"

# Internal staff app (YVA OS) — security headers + keep it out of search results.
# Netlify only reads headers from here or a _headers file at the publish root, so "YVALAW OS/public/_headers"
# (copied to /os/_headers by the build) was never applied — these rules are the ones in force.
# Allowed outside hosts: this project's Supabase (data, files, live updates — change the host here if the project ever
# moves), Stripe (payment form, bank login, card checks), Crisp (client portal chat), Google Fonts. No inline scripts
# except the three one-line "print when loaded" scripts of the invoice / statement / payslip print windows, allowed by
# hash — if one of those lines changes (utils/invoiceHtml.ts, statementHtml.ts, payslipHtml.ts, PayrollPage.tsx),
# update its sha256 here or printing stops (tests/csp.test.ts checks this).
[[headers]]
  for = "/os/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\")"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-XsEvYQeI61UwT9Mz4WdasBY8eAeHqQfnMuYdrCWz23s=' 'sha256-8UIUAuIdPqhicaAtMhPXbnBNCGBLYwp9LdDkhrWt3K4=' 'sha256-aQzETIWrcnXJrGr4qjb7OHpKRZUZv5t/DsJ8ritU7So=' https://js.stripe.com https://*.js.stripe.com https://client.crisp.chat https://settings.crisp.chat; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://client.crisp.chat; font-src 'self' data: https://fonts.gstatic.com https://client.crisp.chat; img-src 'self' data: blob: https:; media-src 'self' blob: https://rwgteyixmbpaxfebwznb.supabase.co https://client.crisp.chat; connect-src 'self' https://rwgteyixmbpaxfebwznb.supabase.co wss://rwgteyixmbpaxfebwznb.supabase.co https://api.stripe.com https://*.stripe.com https://client.crisp.chat https://storage.crisp.chat wss://client.relay.crisp.chat wss://stream.relay.crisp.chat; frame-src 'self' blob: https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://*.stripe.com https://game.crisp.chat; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://*.stripe.com; frame-ancestors 'none'"

# "Pay now" links in invoice emails → Stripe Checkout (netlify/functions/pay-link.cjs)
[[redirects]]
  from = "/pay"
  to = "/.netlify/functions/pay-link"
  status = 200
  force = true

# The site is published from the whole project folder (publish = "."), so these internal files were downloadable
# from the live site: notes (CLAUDE.md, docs/), the YVA OS and YVA Time source, database scripts and build files.
# They now answer "not found". The website, /admin, /os (the built app in os/), /content/prices.json, /posts and
# /jobs stay public. Each folder rule is listed twice: with the space and with %20, so both spellings are covered.
[[redirects]]
  from = "/YVALAW OS/*"
  to = "/os/404.txt"
  status = 404
  force = true
[[redirects]]
  from = "/YVALAW%20OS/*"
  to = "/os/404.txt"
  status = 404
  force = true
[[redirects]]
  from = "/YVA Time/*"
  to = "/os/404.txt"
  status = 404
  force = true
[[redirects]]
  from = "/YVA%20Time/*"
  to = "/os/404.txt"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/os/404.txt"
  status = 404
  force = true
[[redirects]]
  from = "/CLAUDE.md"
  to = "/os/404.txt"
  status = 404
  force = true
[[redirects]]
  from = "/build.js"
  to = "/os/404.txt"
  status = 404
  force = true
[[redirects]]
