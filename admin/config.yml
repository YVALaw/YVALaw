# Content manager (Decap CMS) for yvastaffing.agency/admin.
# Field `name`s are the keys build.js reads from each file's frontmatter —
# rename one here only together with build.js. Labels and hints are free to change.
# Live previews for these collections are in admin/preview.js.

backend:
  name: git-gateway
  branch: main

site_url: https://yvastaffing.agency
display_url: https://yvastaffing.agency
logo:
  src: /logo/img2.png
  show_in_header: true

media_folder: "images/uploads"
public_folder: "/images/uploads"

# Plain-ASCII file names and URLs, also for Spanish titles ("Cómo contratar…" -> como-contratar)
slug:
  encoding: "ascii"
  clean_accents: true

collections:
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    description: "Articles on the Blog page. Changes go live about a minute after you click Publish. Turn on “Draft” to save a post without showing it on the website."
    folder: "posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "blog/{{slug}}/"
    summary: "{{fields.draft | ternary('DRAFT · ', '')}}{{fields.title}} · {{fields.date | date('MMM D, YYYY')}}"
    sortable_fields:
      - { field: "date", label: "Publish date", default_sort: "desc" }
      - { field: "title", label: "Title" }
    view_filters:
      - { label: "Drafts", field: "draft", pattern: true }
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "The headline. It's also the title Google shows in search results."
      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false
        required: false
        hint: "On = saved but hidden from the website. Turn it off and click Publish when the post is ready."
      - label: "Publish date"
        name: "date"
        widget: "datetime"
        default: "{{now}}"
        hint: "Filled in with today's date. The blog lists the newest posts first."
      - label: "Summary"
        name: "description"
        widget: "text"
        hint: "1–2 sentences (about 150 characters). Shown under the title in the blog list and in Google results. The preview on the right counts the characters."
      - label: "Featured image"
        name: "image"
        widget: "image"
        required: false
        hint: "A wide (landscape) photo, at least 1200 px wide. Shown at the top of the post, on its card in the blog list, and when the post is shared."
      - label: "Image description"
        name: "image_alt"
        widget: "string"
        required: false
        hint: "A few words describing the photo, e.g. “Attorney reviewing case files with an assistant”. Read aloud to blind visitors and used by Google."
      - label: "Post"
        name: "body"
        widget: "markdown"
        modes: ["rich_text"]
        buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"]
        editor_components: ["cta", "callout", "table", "image"]
        hint: "Use “Heading 2” for section titles and “Heading 3” for sub-sections. The + button adds a “Book a call” button, a highlight box, a table or an image."

  - name: "jobs"
    label: "Job Posts"
    label_singular: "Job Post"
    description: "Roles on the Careers page. To stop taking applications, set Status to Closed instead of deleting the post."
    folder: "jobs"
    create: true
    slug: "{{slug}}"
    preview_path: "careers.html"
    summary: "{{fields.title}} · {{fields.status}}"
    sortable_fields:
      - { field: "title", label: "Job title", default_sort: "asc" }
      - { field: "date", label: "Publish date" }
    view_filters:
      - { label: "Open", field: "status", pattern: "Open" }
      - { label: "Closed", field: "status", pattern: "Closed" }
    fields:
      - label: "Job title"
        name: "title"
        widget: "string"
        hint: "The role name, e.g. “Legal Intake Specialist”. Also appears in the application form's role list."
      - label: "Status"
        name: "status"
        widget: "select"
        default: "Open"
        options: ["Open", "Closed"]
        hint: "Closed roles stay on the page with an “Applications Closed” button."
      - label: "Highlight at the top of the Careers page"
        name: "featured"
        widget: "boolean"
        default: false
        required: false
        hint: "Up to 3 highlighted open roles appear in the box at the top of the page."
      - label: "Publish date"
        name: "date"
        widget: "datetime"
        default: "{{now}}"
        hint: "Newer roles are listed first."
      - label: "Location"
        name: "location"
        widget: "string"
        default: "Remote"
      - label: "Schedule"
        name: "schedule"
        widget: "string"
        default: "Full / Part-time"
      - label: "Icon"
        name: "icon"
        widget: "select"
        default: "briefcase"
        required: false
        hint: "The picture on the role's card. The preview on the right shows it."
        options:
          - { label: "Briefcase", value: "briefcase" }
          - { label: "Phone", value: "phone" }
          - { label: "Headset", value: "headset" }
          - { label: "Scales of justice", value: "scale" }
          - { label: "Gavel", value: "gavel" }
          - { label: "Document", value: "file-text" }
          - { label: "Signed document", value: "file-signature" }
          - { label: "Folder", value: "folder-open" }
          - { label: "Checklist", value: "clipboard-list" }
          - { label: "Calendar", value: "calendar" }
          - { label: "People", value: "users" }
          - { label: "Person with check mark", value: "user-check" }
          - { label: "Handshake", value: "heart-handshake" }
          - { label: "Languages", value: "languages" }
          - { label: "Email", value: "mail" }
          - { label: "Chat bubble", value: "message-circle" }
          - { label: "Calculator", value: "calculator" }
          - { label: "Medical (stethoscope)", value: "stethoscope" }
          - { label: "Social media (share)", value: "share-2" }
          - { label: "Megaphone", value: "megaphone" }
          - { label: "Web layout", value: "layout" }
          - { label: "Computer", value: "monitor" }
          - { label: "Design (pen)", value: "pen-tool" }
          - { label: "Palette", value: "palette" }
          - { label: "Growth chart", value: "chart-line" }
      - label: "Short description"
        name: "description"
        widget: "text"
        hint: "1–2 sentences shown on the role's card."
      - label: "Key skills"
        name: "skills"
        widget: "list"
        min: 1
        summary: "{{fields.skill}}"
        hint: "3–4 short skills shown as tags on the card, e.g. “Bilingual”."
        field:
          label: "Skill"
          name: "skill"
          widget: "string"
      - label: "Notes"
        name: "body"
        widget: "markdown"
        modes: ["rich_text"]
        required: false
        buttons: ["bold", "italic", "link", "bulleted-list", "numbered-list"]
        editor_components: []
        hint: "Not shown on the Careers page, but not private either: don't put confidential information here."

  # Home page sections + contact details. build.js writes these files into the
  # pages (see "Website content" in build.js); previews are in admin/preview.js.
  - name: "website"
    label: "Website Content"
    description: "Testimonials, FAQ, About numbers and contact details. Changes go live about a minute after you click Publish."
    files:
      - name: "testimonials"
        label: "Testimonials"
        file: "content/testimonials.json"
        description: "The “What Our Clients Say” slider on the home page."
        fields:
          - label: "Testimonials"
            label_singular: "Testimonial"
            name: "testimonials"
            widget: "list"
            min: 1
            summary: "{{fields.name}} · {{fields.company}}"
            hint: "Shown one at a time, in this order. Drag to reorder."
            fields:
              - label: "Quote"
                name: "quote"
                widget: "text"
                hint: "What the client said. Quotation marks are added automatically."
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Company"
                name: "company"
                widget: "string"
                required: false

      - name: "faq"
        label: "FAQ"
        file: "content/faq.json"
        description: "The “Frequently Asked Questions” window on the home page. Google can also show these questions in search results."
        fields:
          - label: "Questions"
            label_singular: "Question"
            name: "questions"
            widget: "list"
            min: 1
            summary: "{{fields.question}}"
            hint: "Drag to reorder."
            fields:
              - label: "Question"
                name: "question"
                widget: "string"
              - label: "Answer"
                name: "answer"
                widget: "markdown"
                modes: ["rich_text"]
                buttons: ["bold", "link"]
                editor_components: []
                hint: "Bold words are highlighted in dark navy."

      - name: "stats"
        label: "About Numbers"
        file: "content/stats.json"
        description: "The six number cards next to “Our Story” on the home page. Each position has a fixed color (navy, yellow, light), so dragging a card to another position changes its color."
        fields:
          - label: "Cards"
            label_singular: "Card"
            name: "stats"
            widget: "list"
            allow_add: false
            allow_remove: false
            summary: "{{fields.value}} · {{fields.label_en}}"
            fields:
              - label: "Number"
                name: "value"
                widget: "string"
                hint: "Keep it short, e.g. 2023, 60% or 50+."
              - label: "Label (English)"
                name: "label_en"
                widget: "string"
              - label: "Label (Spanish)"
                name: "label_es"
                widget: "string"
                hint: "Shown when a visitor switches the site to Español."
              - label: "Hover text (English)"
                name: "hover_en"
                widget: "text"
                hint: "Appears when a visitor points at the card (computers only)."
              - label: "Hover text (Spanish)"
                name: "hover_es"
                widget: "text"
              - label: "Icon"
                name: "icon"
                widget: "select"
                options:
                  - { label: "Calendar", value: "calendar" }
                  - { label: "Arrow down (savings)", value: "trending-down" }
                  - { label: "Arrow up (growth)", value: "trending-up" }
                  - { label: "Bar chart", value: "bar-chart-2" }
                  - { label: "Line chart", value: "chart-line" }
                  - { label: "Building", value: "building-2" }
                  - { label: "People", value: "users" }
                  - { label: "Person with check mark", value: "user-check" }
                  - { label: "Lightning bolt", value: "zap" }
                  - { label: "Clock", value: "clock" }
                  - { label: "Globe", value: "globe" }
                  - { label: "Languages", value: "languages" }
                  - { label: "Briefcase", value: "briefcase" }
                  - { label: "Scales of justice", value: "scale" }
                  - { label: "Star", value: "star" }
                  - { label: "Award", value: "award" }
                  - { label: "Handshake", value: "heart-handshake" }
                  - { label: "Dollar sign", value: "dollar-sign" }
                  - { label: "Percent", value: "percent" }
                  - { label: "Target", value: "target" }
                  - { label: "Rocket", value: "rocket" }
                  - { label: "Shield with check mark", value: "shield-check" }
                  - { label: "Thumbs up", value: "thumbs-up" }

      - name: "contact"
        label: "Contact & Hours"
        file: "content/contact.json"
        description: "Office hours appear in the top bar, phone menu and footer of every page. The email address (contact@yvastaffing.agency) is part of the site's code; ask your developer to change it."
        fields:
          - label: "Office hours (English)"
            name: "hours_en"
            widget: "string"
            hint: "e.g. Mon – Fri · 9am – 6pm EST"
          - label: "Office hours (Spanish)"
            name: "hours_es"
            widget: "string"
            hint: "Shown on the home page when a visitor switches to Español."
          - label: "Location (English)"
            name: "location_en"
            widget: "string"
            hint: "Shown in the home page footer."
          - label: "Location (Spanish)"
            name: "location_es"
            widget: "string"
          - label: "Phone"
            name: "phone"
            widget: "string"
            required: false
            pattern: ['^[+0-9 ().-]*$', "Use only numbers, spaces and + ( ) - ."]
            hint: "Shown in the footer of the home page and blog when filled in. Include the country code, e.g. +1 305 555 0123."
          - label: "WhatsApp number"
            name: "whatsapp"
            widget: "string"
            required: false
            pattern: ['^[+0-9 ().-]*$', "Use only numbers, spaces and + ( ) - ."]
            hint: "Adds a “WhatsApp” link to the footer of the home page and blog. Include the country code, e.g. +1 809 555 0123."
          - label: "LinkedIn page"
            name: "linkedin"
            widget: "string"
            required: false
            pattern: ['^(https://\S+)?$', "Paste the full address, starting with https://"]
            hint: "The full address, starting with https://. Adds a LinkedIn icon to the home page footer."
          - label: "Instagram page"
            name: "instagram"
            widget: "string"
            required: false
            pattern: ['^(https://\S+)?$', "Paste the full address, starting with https://"]
            hint: "Adds an Instagram icon to the home page footer."
          - label: "Facebook page"
            name: "facebook"
            widget: "string"
            required: false
            pattern: ['^(https://\S+)?$', "Paste the full address, starting with https://"]
            hint: "Adds a Facebook icon to the home page footer."
